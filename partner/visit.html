<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>방문</title><link rel=stylesheet href=styles.css></head><body><header><h1>방문</h1><p class=muted id=sub></p></header><div class=card id=box></div><div class=card><b>위치</b><div class=map>지도 연동 전 · Al Reem</div></div><button class=btn id=go>체크인</button><a class=btn href=quote.html>견적으로</a><nav class=tab><a href=index.html>오늘</a><a class=on href=visit.html>방문</a><a href=quote.html>견적</a><a href=report.html>리포트</a></nav><script src=../flow.js></script><script>const L={assigned:'배정됨',checked_in:'체크인',quote_sent:'견적 발송',accepted:'공사 가능',reported:'리포트됨'};function job(){const q=new URLSearchParams(location.search).get('id');const s=HMP.load();if(q&&s.visits[q])return q;const hit=Object.entries(s.visits).find(([,v])=>v.assigned);return hit?hit[0]:'Vpipe'}function draw(){const id=job();const v=HMP.load().visits[id];if(!v){box.textContent='방문 없음';return}window._id=id;sub.textContent=v.unit+' · '+v.trade;box.innerHTML=`<b>${L[v.status]||v.status}</b>${v.partner||''}<br>${v.checkin_at?'체크인 '+v.checkin_at.slice(11,16):'체크인 전'}`;go.disabled=!!v.checkin_at}draw();go.onclick=()=>{alert(HMP.checkin(window._id)||'체크인');draw()}</script></body></html>
