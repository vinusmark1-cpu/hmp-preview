<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>견적</title><link rel=stylesheet href=styles.css></head><body><header><h1>견적</h1><p class=muted>확인 전 공사 안 함</p></header><div class=card><b>점검</b>80 AED</div><div class=card><b>밸브</b>120 AED</div><div class=card><span class=price>200 AED</span><p class=muted>VAT 5% 운영자 설정</p></div><div class=card id=msg></div><button class=btn id=send>고객에게 보내기</button><nav class=tab><a href=index.html>오늘</a><a href=visit.html>방문</a><a class=on href=quote.html>견적</a><a href=report.html>리포트</a></nav><script src=../flow.js></script><script>function id(){const hit=Object.entries(HMP.load().visits).find(([,v])=>v.assigned);return hit?hit[0]:'Vpipe'}function draw(){const v=HMP.load().visits[id()];msg.textContent=v.status==='quote_sent'||v.status==='accepted'?'보냄. 고객 확인 대기.':v.checkin_at?'체크인 됨. 보낼 수 있음.':'먼저 체크인'}draw();send.onclick=()=>{const v=HMP.load().visits[id()];if(!v.checkin_at&&v.status!=='checked_in'&&v.status!=='quote_sent'){alert('체크인 후');return}HMP.set(id(),{status:'quote_sent',items:[{name:'점검',aed:80},{name:'밸브',aed:120}]});draw();alert('보냄. 고객 견적서에서 확인')}</script></body></html>
