<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오늘</title><link rel=stylesheet href=styles.css></head><body><header><h1>오늘</h1><p class=muted>배정된 방문만</p></header><div id=list></div><nav class=tab><a class=on href=index.html>오늘</a><a href=visit.html>방문</a><a href=quote.html>견적</a><a href=report.html>리포트</a></nav><script src=../flow.js></script><script>const L={wait_deposit:'예약금 미납',wait_assign:'배정 대기',assigned:'배정됨',checked_in:'체크인',quote_sent:'견적 발송',accepted:'공사 가능',reported:'잔금 청구',paid:'완납'};const jobs=Object.entries(HMP.load().visits).filter(([,v])=>v.assigned);list.innerHTML=jobs.length?jobs.map(([id,v])=>`<a class=card href=visit.html?id=${id}><b>${v.unit}</b>${v.trade} · ${v.partner||''}<br><span class=badge>${L[v.status]||v.status}</span></a>`).join(''):'<div class=card>오늘 배정 없음. 운영에서 배정 후 여기.</div>';</script></body></html>
