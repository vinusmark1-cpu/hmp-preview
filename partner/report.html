<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>리포트</title><link rel=stylesheet href=styles.css></head><body><header><h1>리포트</h1><p class=muted>고객 견적 확인 후</p></header><div class=card id=box></div><div class=card><b>작업 사진</b><p class=muted>전 · 후 2장 이상</p><div class=map>사진 슬롯</div></div><button class=btn id=go>완료 · 잔금 청구</button><nav class=tab><a href=index.html>오늘</a><a href=visit.html>방문</a><a href=quote.html>견적</a><a class=on href=report.html>리포트</a></nav><script src=../flow.js></script><script>function id(){const hit=Object.entries(HMP.load().visits).find(([,v])=>v.assigned);return hit?hit[0]:'Vpipe'}function draw(){const v=HMP.load().visits[id()];const ok=v.status==='accepted'||v.status==='working';box.innerHTML=ok?'견적 확인됨. 리포트 가능.':v.status==='reported'?'잔금 청구됨.':'고객 확인 전. 잠금.'}draw();go.onclick=()=>{const v=HMP.load().visits[id()];if(v.status!=='accepted'&&v.status!=='working'){alert('고객 견적 확인 필요');return}HMP.set(id(),{status:'reported'});draw()}</script></body></html>
