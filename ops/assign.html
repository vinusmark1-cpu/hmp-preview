<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>배정</title></head><body style="font-family:system-ui;padding:16px"><h1>배정</h1><div id=q></div><script src=../flow.js></script><script>function draw(){q.innerHTML=HMP.queue().map(v=>`<p>${v.unit} ${v.trade} 예약금:${v.deposit_paid?'납':'미납'} <button onclick="alert(HMP.assign('${v.id}')||'배정됨');draw()">배정</button></p>`).join('')||'큐 비움'}draw()</script></body></html>
