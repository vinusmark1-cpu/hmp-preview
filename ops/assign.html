<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>배정</title><link rel=stylesheet href=../customer/styles.css></head><body><header><h1>배정</h1><p class=muted>예약금 미납은 안 동작</p></header><div id=q></div><p class=muted style=margin:16px><a href=index.html>대시보드</a></p><script src=../flow.js></script><script>function draw(){const rows=HMP.queue();q.innerHTML=rows.length?rows.map(v=>`<div class=card>${v.unit} · ${v.trade}<p class=muted>예약금 ${v.deposit_paid?'납':'미납'}</p><button class=btn onclick="const m=HMP.assign('${v.id}');alert(m||'배정됨');draw()">배정</button></div>`).join(''):'<div class=card>큐 비움</div>'}draw()</script></body></html>
