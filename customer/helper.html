<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>헬퍼</title><link rel=stylesheet href=styles.css></head><body><header><h1>오늘 할 일</h1><p class=muted id=prog></p></header><div id=list></div><p class=muted style=margin:16px>가격·견적은 안 보입니다.</p><nav class=tab><a class=on href=helper.html>오늘</a><a href=self.html>전체</a><a href=index.html>집주인</a></nav><script src=../flow.js></script><script>function d(){const t=(HMP.load().tasks||[]).filter(x=>x.helper&&x.when==='today');prog.textContent=t.filter(x=>x.done).length+' / '+t.length;list.innerHTML=t.map(x=>`<div class=card onclick="HMP.toggleTask('${x.id}');d()">${x.done?'완료':'대기'} · ${x.room}<br><b>${x.title}</b></div>`).join('')}d()</script></body></html>
