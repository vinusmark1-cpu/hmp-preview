<!doctype html><html lang=ko><head><meta charset=utf-8><title>헬퍼</title><link rel=stylesheet href=styles.css></head><body><header><h1>오늘 할 일</h1><p id=p></p></header><div id=list></div><script src=../flow.js></script><script>function d(){const t=HMP.load().tasks.filter(x=>x.helper&&x.when==='today');p.textContent=t.filter(x=>x.done).length+' / '+t.length;list.innerHTML=t.map(x=>`<div class=card onclick="HMP.toggleTask('${x.id}');d()">${x.done?'완료':'대기'} ${x.title}</div>`).join('')}d()</script></body></html>
