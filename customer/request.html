<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>요청</title><link rel=stylesheet href=styles.css></head><body><header><h1>요청</h1></header><a class=btn href=new.html>새 요청</a><div id=list></div><nav class=tab><a href=index.html>홈</a><a href=request.html>요청</a><a href=../ops/assign.html>배정</a></nav><script src=../flow.js></script><script>const L={wait_deposit:'예약금 미납',wait_assign:'배정 대기',assigned:'배정',checked_in:'체크인',quote_sent:'견적',accepted:'공사',reported:'잔금',paid:'완납'};function draw(){const s=HMP.load();list.innerHTML=Object.entries(s.visits).map(([id,v])=>{let act='';if(!v.deposit_paid)act=`<button class=btn onclick="HMP.payDeposit('${id}',true);draw()">예약금 ${v.deposit} AED</button>`;return `<div class=card>${v.unit} · ${v.trade}<div class=price>${HMP.sum(v.items)||0} AED</div>${L[v.status]||v.status} ${act}</div>`}).join('')}draw()</script></body></html>
