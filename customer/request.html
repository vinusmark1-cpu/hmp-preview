<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content=#0F766E><title>요청</title><link rel=stylesheet href=styles.css></head><body><header><h1>요청</h1></header><a class="btn ghost" href=new.html>새 요청</a><div id=list></div><nav class=tab><a href=index.html>홈</a><a href=plan.html>도면</a><a href=self.html>할일</a><a class=on href=request.html>요청</a><a href=me.html>내정보</a></nav><script src=../flow.js></script><script>
const L={wait_deposit:'예약금 미납',wait_assign:'배정 대기',assigned:'배정됨',checked_in:'체크인',quote_sent:'견적 확인',accepted:'공사 중',rejected:'거절',reported:'잔금 청구',paid:'완납'};
const demo=new URLSearchParams(location.search).get('state');
function draw(){
  if(demo==='loading'){list.innerHTML='<div class=card role=status><p class=muted>불러오는 중</p></div>';return}
  if(demo==='error'){list.innerHTML='<div class=card role=alert><b>불러오지 못함</b><p class=muted>다시 시도해 주세요.</p></div><a class="btn ghost" href=request.html>다시 시도</a>';return}
  let entries=Object.entries(HMP.load().visits);
  if(demo==='empty')entries=[];
  if(!entries.length){list.innerHTML='<div class=card><b>요청 없음</b><p class=muted>새 요청에서 서비스를 고르세요.</p></div>';return}
  list.innerHTML=entries.map(([id,v])=>{
    let act='';
    if(!v.deposit_paid){
      const paying=demo==='paying';
      act=`<button class=btn type=button data-pay="${id}" ${paying?'disabled':''}>${paying?'결제 중':'예약금 '+v.deposit+' AED'}</button>`;
    }
    const price=v.needs_quote?'방문 후 견적':(HMP.sum(v.items)+' AED');
    return `<div class=card><div class=muted>${v.unit} · ${v.trade}</div><div class=price>${price}</div>${L[v.status]||v.status}${v.needs_quote?'<p class=muted><a href=quote.html>견적서</a></p>':''}${act}</div>`;
  }).join('');
  if(demo==='paying')return;
  list.querySelectorAll('[data-pay]').forEach(btn=>{btn.onclick=()=>pay(btn)});
}
function pay(btn){
  if(btn.disabled)return;
  const id=btn.getAttribute('data-pay');
  btn.disabled=true;
  btn.textContent='결제 중';
  setTimeout(()=>{HMP.payDeposit(id,true);draw()},700);
}
draw();
</script></body></html>
