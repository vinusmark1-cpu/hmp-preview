<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>할일</title><link rel=stylesheet href=styles.css></head><body><header><h1>할일</h1><p class=muted><a href=helper.html>헬퍼 오늘</a></p></header><div id=list></div><nav class=tab><a href=index.html>홈</a><a href=plan.html>도면</a><a class=on href=self.html>할일</a><a href=request.html>요청</a><a href=me.html>내정보</a></nav><script src=../flow.js></script><script>const lab={today:'오늘',week:'이번주',next:'다음주'};function draw(){const g={today:[],week:[],next:[]};(HMP.load().tasks||[]).forEach(t=>(g[t.when]||g.week).push(t));list.innerHTML=['today','week','next'].map(k=>!g[k].length?'':`<div class=card><b>${lab[k]} ${g[k].filter(x=>x.done).length}/${g[k].length}</b>`+g[k].map(t=>`<p onclick="HMP.toggleTask('${t.id}');draw()">${t.done?'✓':'○'} ${t.title} · ${t.room}</p>`).join('')+'</div>').join('')}draw()</script></body></html>
