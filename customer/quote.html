<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>견적서</title><link rel=stylesheet href=styles.css></head><body><header><h1>견적서</h1></header><div class=card id=sheet></div><div id=acts></div><p class=muted id=note style=margin:0_16px></p><nav class=tab><a href=index.html>홈</a><a href=plan.html>도면</a><a href=self.html>할일</a><a class=on href=request.html>요청</a><a href=me.html>내정보</a></nav><script src=../flow.js></script><script>const id='Vpipe';function draw(){const v=HMP.load().visits[id];if(!v){sheet.textContent='없음';return}const sum=HMP.sum(v.items),vat=HMP.load().vat,bal=Math.max(0,sum-v.deposit);sheet.innerHTML=`${v.unit} · ${v.trade}<br>${v.items.map(i=>i.name+' '+i.aed+' AED').join('<br>')}<br>소계 ${sum} · VAT ${vat}%<br>예약금 ${v.deposit} ${v.deposit_paid?'납':'미납'}<br><b class=price>잔금 ${bal} +VAT</b>`;if(v.status==='rejected'){acts.innerHTML='';note.textContent='거절. 예약금은 출장비.';return}if(['accepted','working','reported','paid'].includes(v.status)){acts.innerHTML='';note.textContent='확인됨. 공사 가능.';return}if(v.status!=='quote_sent'){acts.innerHTML=`<button class=btn onclick="HMP.set('${id}',{status:'quote_sent'});draw()">견적 받기 (데모)</button>`;note.textContent='파트너가 보낸 견적 대기.';return}acts.innerHTML=`<button class=btn onclick="HMP.set('${id}',{status:'accepted'});draw()">견적 확인</button><button class=btn onclick="HMP.set('${id}',{status:'rejected'});draw()" style="background:#fff;color:#B42318;border:1px solid #B42318">거절</button>`;note.textContent='확인 전 공사 안 함.';}draw()</script></body></html>
