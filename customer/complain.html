<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>민원</title><link rel=stylesheet href=styles.css></head><body><header><h1>민원</h1><p class=muted>사진 최대 10</p></header><div class=card><b>품질 · AC</b><p class=muted>청소 다음날 냄새</p><input id=f type=file accept="image/*" multiple><div id=g style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px"></div></div><nav class=tab><a href=index.html>홈</a><a href=plan.html>도면</a><a href=self.html>할일</a><a href=request.html>요청</a><a class=on href=me.html>내정보</a></nav><script>const K='hmp_shots';const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};function draw(){const a=load();g.innerHTML=Array.from({length:10},(_,i)=>a[i]?`<img src="${a[i]}" style="width:100%;height:56px;object-fit:cover;border-radius:8px">`:`<div class=shot>+${i+1}</div>`).join('')}f.onchange=e=>{const cur=load();[...e.target.files].slice(0,10-cur.length).forEach(file=>{const r=new FileReader();r.onload=()=>{const n=load();n.push(r.result);localStorage.setItem(K,JSON.stringify(n.slice(0,10)));draw()};r.readAsDataURL(file)})};draw()</script></body></html>
