<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>새 요청</title><link rel=stylesheet href=styles.css></head><body><header><h1>새 요청</h1></header><div id=list></div><script src=../flow.js></script><script>list.innerHTML=HMP.load().catalog.map(c=>`<div class=card><b>${c.name}</b><div class=price>${c.needs_quote?'방문 후 견적':c.aed+' AED'}</div><p class=muted>불가: ${c.exclude}</p><button class=btn onclick="HMP.createVisit('${c.id}');location='request.html'">요청</button></div>`).join('')</script></body></html>
