<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>도면</title><link rel=stylesheet href=styles.css></head><body><header><h1>도면</h1><p class=muted>핀 = 위치</p></header><div class=floor><div class=rm style="left:6%;top:8%;width:48%;height:48%">거실</div><div class=rm style="left:58%;top:8%;width:36%;height:38%">주방</div><div class=rm style="left:6%;top:60%;width:48%;height:32%">침실</div><div class=rm style="left:58%;top:50%;width:36%;height:42%">욕실</div><div id=dots></div></div><div id=list></div><nav class=tab><a href=index.html>홈</a><a class=on href=plan.html>도면</a><a href=self.html>할일</a><a href=request.html>요청</a><a href=me.html>내정보</a></nav><script src=../flow.js></script><script>const s=HMP.load();dots.innerHTML=(s.pins||[]).map(p=>`<div class=dot style="left:${p.x}%;top:${p.y}%">${p.label.slice(0,2)}</div>`).join('');list.innerHTML=(s.pins||[]).map(p=>`<div class=card><b>${p.room} · ${p.label}</b><div class=muted>${p.note||''}</div><div class=shot>${p.photo==='있음'?'사진 있음':'사진 없음'}</div></div>`).join('')</script></body></html>
